<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memproses login • ShowLink</title><link rel="stylesheet" href="/css/showlink-components.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body class="auth-page"><main class="auth-main"><section class="auth-card" style="max-width:460px;width:calc(100% - 32px);text-align:center"><div class="auth-head"><div class="auth-icon"><i class="fa-brands fa-google"></i></div><h2 data-i18n="processingLogin">Memproses login...</h2><p data-i18n="pleaseWait">Mohon tunggu sebentar.</p></div><div class="auth-alert is-visible" data-status>Menyiapkan akun ShowLink...</div></section></main>
<script src="/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase-client.js"></script><script>
(async()=>{const el=document.querySelector("[data-status]");try{const sb=await window.ShowLinkSupabase.load();const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session?.user){el.textContent="Login belum selesai. Silakan kembali.";return}const u=data.session.user;const meta=u.user_metadata||{};let username=meta.username||meta.preferred_username||"";const {data:profile}=await sb.from("profiles").select("username").eq("id",u.id).maybeSingle();username=profile?.username||username;if(!username){location.replace("/google-profile.html");return}localStorage.setItem("showlink_user",JSON.stringify({id:u.id,email:u.email||"",user_metadata:meta}));location.replace("/dashboard.html")}catch(e){el.textContent=e.message||"Login Google gagal."}})();
</script></body></html>
