<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signing in — ShowLink</title>
<link rel="stylesheet" href="/css/index.css">
<link rel="stylesheet" href="/assets/css/showlink-components.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
<main class="auth-main">
  <div class="sl-container" style="max-width:520px">
    <section class="auth-card" style="margin:auto;text-align:center">
      <div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h1 style="font-size:1.5rem">Signing in…</h1>
      <p id="auth-callback-message">Please wait while we finish signing you in.</p>
      <a class="auth-link" href="/login.html" id="auth-callback-link" hidden>Back to login</a>
    </section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js"></script>
<script>
(async()=>{
  const msg=document.getElementById("auth-callback-message");
  const link=document.getElementById("auth-callback-link");
  try{
    const sb=await window.ShowLinkSupabase.load();
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(!data.session) throw new Error("Google sign-in did not create a session.");
    const u=data.session.user;
    localStorage.setItem("showlink_user",JSON.stringify({
      id:u.id,email:u.email||"",user_metadata:u.user_metadata||{}
    }));
    location.replace("/dashboard.html");
  }catch(e){
    msg.textContent=e?.message||"Google sign-in failed. Please try again.";
    link.hidden=false;
  }
})();
</script>
</body>
</html>
