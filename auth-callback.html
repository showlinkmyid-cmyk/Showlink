<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk • ShowLink</title><link rel="stylesheet" href="/assets/css/showlink-components.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body class="auth-page"><main class="auth-main"><section class="auth-card" style="max-width:460px;width:calc(100% - 32px);text-align:center"><div class="auth-head"><h2>Memproses login...</h2><p>Mohon tunggu sebentar.</p></div><div class="auth-alert is-visible" data-status>Menyiapkan akun ShowLink...</div></section></main>
<script src="/assets/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-client.js"></script>
<script>(async()=>{const el=document.querySelector('[data-status]');try{const sb=await window.ShowLinkSupabase.load();const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session?.user){localStorage.setItem('showlink_user',JSON.stringify({id:data.session.user.id,email:data.session.user.email||'',user_metadata:data.session.user.user_metadata||{}}));location.replace('/dashboard.html');return;}el.textContent='Login belum selesai. Silakan kembali ke halaman login.';}catch(e){el.textContent=e.message||'Login Google gagal.';}})();</script></body></html>
