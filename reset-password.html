<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ubah Password — ShowLink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/css/index.css"><link rel="stylesheet" href="/assets/css/showlink-components.css"><link rel="stylesheet" href="/css/auth.css">
<script>(function(){try{var t=localStorage.getItem('showlink-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
</head><body class="auth-page"><div data-showlink-navbar></div><main class="auth-main"><div class="sl-container auth-wrap">
<section class="auth-card" style="max-width:520px;width:100%;margin:auto" aria-labelledby="reset-heading">
<div class="auth-head"><div class="auth-icon"><i class="fa-solid fa-key"></i></div><h2 id="reset-heading" data-i18n="changePassword">Ubah password</h2><p data-i18n="changePasswordSub">Masukkan password baru dan konfirmasi password.</p></div>
<div class="auth-alert" data-auth-alert role="alert"></div>
<form class="auth-form" data-reset-form>
<div class="auth-field"><label for="new-password" data-i18n="newPassword">Password baru</label><div class="auth-input-wrap"><i class="fa-solid fa-lock"></i><input class="auth-input" id="new-password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="auth-password-toggle" type="button" data-password-toggle data-target="new-password"><i class="fa-regular fa-eye"></i></button></div></div>
<div class="auth-field"><label for="confirm-new-password" data-i18n="confirmPassword">Konfirmasi password</label><div class="auth-input-wrap"><i class="fa-solid fa-shield-halved"></i><input class="auth-input" id="confirm-new-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="auth-password-toggle" type="button" data-password-toggle data-target="confirm-new-password"><i class="fa-regular fa-eye"></i></button></div></div>
<button class="auth-submit" type="submit"><i class="fa-solid fa-key"></i> <span data-i18n="changePasswordButton">Ubah password</span></button>
</form></section></div></main><div data-showlink-footer></div>
<script src="/assets/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-client.js"></script><script src="/assets/js/showlink-components.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll("[data-password-toggle]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.target),s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>'});
const f=document.querySelector("[data-reset-form]"),a=document.querySelector("[data-auth-alert]");f?.addEventListener("submit",async e=>{e.preventDefault();a.classList.remove("is-visible");const p=f.password.value,c=f.confirmPassword.value;if(p.length<8){a.textContent="Password minimal 8 karakter.";a.classList.add("is-visible");return}if(p!==c){a.textContent="Konfirmasi password tidak sama.";a.classList.add("is-visible");return}try{const sb=await window.ShowLinkSupabase.load();const {error}=await sb.auth.updateUser({password:p});if(error)throw error;a.textContent="Password berhasil diubah. Mengalihkan ke Dashboard...";a.classList.add("is-visible","auth-success");setTimeout(()=>location.replace("/dashboard.html"),700)}catch(err){a.textContent=err.message||"Gagal mengubah password.";a.classList.add("is-visible")}})});
</script></body></html>
