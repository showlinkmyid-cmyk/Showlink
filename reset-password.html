<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Reset Password — ShowLink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/css/index.css">

<link rel="stylesheet" href="/css/auth.css">
<script>
(function(){try{var t=localStorage.getItem('showlink-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t}}catch(e){}})();
</script>
<link rel="stylesheet" href="/css/showlink-components.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="icon" type="image/svg+xml" href="/assets/showlink-favicon.svg"><link rel="icon" type="image/png" sizes="512x512" href="/assets/showlink-favicon.png"><link rel="apple-touch-icon" href="/assets/showlink-favicon.png"></head>
<body class="auth-page">
<div data-showlink-navbar></div>
<main class="auth-main">
  <div class="sl-container auth-wrap">
    <section class="auth-card" style="max-width:560px;width:100%;margin:auto" aria-labelledby="reset-heading">
      <div class="auth-head">
        <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
        <h2 id="reset-heading" data-i18n="resetPasswordTitle">Reset password</h2>
        <p data-i18n="resetPasswordSub">Masukkan Gmail, lalu buat password baru dan konfirmasi password.</p>
      </div>

      <div class="auth-alert" data-auth-alert role="alert"></div>

      <form class="auth-form" data-reset-request-form>
        <div class="auth-field">
          <label for="reset-email" data-i18n="email">Gmail</label>
          <div class="auth-input-wrap">
            <i class="fa-regular fa-envelope"></i>
            <input class="auth-input" id="reset-email" name="email" type="email" autocomplete="email"
                   placeholder="you@gmail.com" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="new-password" data-i18n="newPassword">Password baru</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input class="auth-input" id="new-password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>
            <button class="auth-password-toggle" type="button" data-password-toggle data-target="new-password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirm-new-password" data-i18n="confirmPassword">Konfirmasi password</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-shield-halved"></i>
            <input class="auth-input" id="confirm-new-password" name="confirmPassword" type="password"
                   minlength="8" autocomplete="new-password" required>
            <button class="auth-password-toggle" type="button" data-password-toggle data-target="confirm-new-password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button class="auth-submit" type="submit">
          <i class="fa-solid fa-key"></i>
          <span data-i18n="changePasswordButton">Ubah password</span>
        </button>
      </form>

      <p class="auth-hint" style="margin-top:14px;text-align:center" data-i18n="resetPasswordHint">
        Demi keamanan, ShowLink akan mengirim link verifikasi ke Gmail. Setelah link dibuka, password baru dapat diterapkan.
      </p>

      <div class="auth-bottom">
        <span data-i18n="rememberPassword">Ingat password?</span>
        <a class="auth-link" href="/login.html" data-i18n="signIn">Masuk</a>
      </div>
    </section>
  </div>
</main>
<div data-showlink-footer></div>

<script src="/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script><script src="/js/showlink-components.js" defer></script><script src="/js/navbar.js" defer></script><script src="/js/footer.js" defer></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const q = (s,r=document)=>r.querySelector(s);
  const form=q("[data-reset-request-form]");
  const alertBox=q("[data-auth-alert]");
  const show=(msg,ok=false)=>{alertBox.textContent=msg;alertBox.classList.toggle("auth-success",ok);alertBox.classList.add("is-visible")};
  document.querySelectorAll("[data-password-toggle]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=document.getElementById(btn.dataset.target); if(!i)return;
      const showIt=i.type==="password"; i.type=showIt?"text":"password";
      btn.innerHTML=showIt?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>';
    });
  });

  let sb=null;
  try{ sb=await window.ShowLinkSupabase.load(); }catch(e){ show(e.message||"Supabase belum dikonfigurasi."); return; }

  // If Supabase has already established a recovery session, this page is now the
  // secure final step. The email field remains visible as requested.
  const {data:{session}}=await sb.auth.getSession();
  const hash=location.hash||"";
  const recoveryFromHash=/access_token=|type=recovery/.test(hash);

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    alertBox.classList.remove("is-visible");
    const email=q("#reset-email").value.trim();
    const password=q("#new-password").value||"";
    const confirm=q("#confirm-new-password").value||"";

    if(!email){show("Gmail wajib diisi.");return}
    if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){show("Format Gmail tidak valid.");return}
    if(password.length<8){show("Password minimal 8 karakter.");return}
    if(password!==confirm){show("Konfirmasi password tidak sama.");return}

    const btn=q(".auth-submit"); btn.disabled=true;
    try{
      // Without a recovery session, email ownership must be verified first.
      // We deliberately do not expose or use a service-role key in the browser.
      const {data:{session:current}}=await sb.auth.getSession();
      if(!current && !recoveryFromHash){
        const {error}=await sb.auth.resetPasswordForEmail(email,{
          redirectTo:`${location.origin}/reset-password.html`
        });
        if(error) throw error;
        show("Link reset password sudah dikirim ke Gmail. Buka link tersebut, lalu kembali ke halaman ini untuk menerapkan password baru.",true);
        return;
      }

      const {data:{user}}=await sb.auth.getUser();
      if(user?.email && user.email.toLowerCase()!==email.toLowerCase()){
        show("Gmail tidak sesuai dengan akun yang sedang dipulihkan."); return;
      }
      const {error}=await sb.auth.updateUser({password});
      if(error) throw error;
      show("Password berhasil diubah. Mengalihkan ke Dashboard...",true);
      setTimeout(()=>location.replace("/dashboard.html"),900);
    }catch(err){
      show(err.message||"Gagal memproses reset password.");
    }finally{btn.disabled=false}
  });

  // Prefill the email from the locally remembered account when available.
  const remembered=localStorage.getItem("showlink_last_email");
  if(remembered && !q("#reset-email").value) q("#reset-email").value=remembered;
});
</script>
</body>
</html>
