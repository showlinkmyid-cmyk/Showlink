<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><meta name="description" content="Payment Link — ShowLink"><title>Payment Link — ShowLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/payment-link.css"><script src="/js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase-client.js"></script><script>(function(){try{var t=localStorage.getItem('showlink-theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}}catch(e){}})();</script></head><body class="dashboard-page" data-page-title-id="Payment Link — ShowLink" data-page-title-en="Payment Link — ShowLink"><div id="showlink-app"></div><main class="sl-main"><div class="sl-container"><section class="sl-main-hero"><div><span class="sl-main-kicker"><i class="fa-solid fa-credit-card"></i> SHOWLINK</span><h1>Buat Payment Link</h1><p class="sl-main-intro">Buat link `/p/xxx` yang langsung membuka halaman pembayaran lalu membuka konten asli setelah pembayaran terverifikasi.</p></div></section><div class="sl-main-card"><form id="create-link-form" data-type="payment" class="create-form"><label class="create-field"><span>Judul</span><input name="title" placeholder="Premium content" required></label><label class="create-field"><span>Deskripsi</span><textarea name="description" rows="4" placeholder="Jelaskan isi konten"></textarea></label><label class="create-field"><span>Harga (IDR)</span><input name="price" placeholder="15000" requ
